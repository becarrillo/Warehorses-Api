server:
  port: 8081

spring:
  application:
    name: WAREHORSES-API
  datasource:
    url: jdbc:postgresql://localhost:5432/{$DB_NAME}
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

socket:
  config:
    allowed-headers: "Content-Type, Cookie, Accept, Origin, X-Requested-With"
    host: "localhost"
    port: 9092

app:
  cors:
    allowed-origin: "http://localhost:5173"
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 89401000